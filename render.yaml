services:
  - type: web
    name: erni-pms
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG_MODE
        value: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: erni_pms
