services:
  - type: web
    name: erni-pms
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG_MODE
        value: false
      - key: AUTO_INIT_DB
        value: "1"
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: erni-pms-db
          property: connectionString

databases:
  - name: erni-pms-db
    plan: free
    region: oregon
    databaseName: erni_pms
    user: erni_user
