# CGI processes do not inherit the container environment automatically. The
# auth/restore helpers and Git hooks need the same database as the PMS website.
PassEnv DATABASE_URL DB_URL DB_DRIVER DB_HOST DB_PORT DB_USER DB_PASS DB_NAME DB_SSLMODE
PassEnv RENDER APP_ENV APP_URL APP_BASE_PATH DEBUG_MODE
PassEnv GIT_STORAGE_ROOT GIT_PROJECT_ROOT GIT_WORKSPACE_ROOT ERNI_PMS_SYNC_ENDPOINT
SetEnv GIT_HTTP_EXPORT_ALL 1
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

ScriptAlias /git/ /usr/local/bin/git-http-backend-wrapper.sh/

<Directory "/usr/local/bin">
    Options +ExecCGI -Indexes
    Require all granted
</Directory>
