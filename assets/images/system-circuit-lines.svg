<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" fill="none">
  <style>
    .circuit-energy {
      animation: circuit-energy-fade .55s ease 3.15s 1 forwards;
    }

    .circuit-energy path {
      stroke-dasharray: 22 86;
      animation: circuit-crawl 3.2s ease-out 1 both;
    }

    .circuit-energy path:nth-child(3n + 2) {
      animation-direction: reverse;
    }

    .circuit-nodes circle {
      animation: circuit-node-pulse 2.4s ease-out 1 both;
      transform-box: fill-box;
      transform-origin: center;
    }

    .circuit-nodes circle:nth-child(3n + 2) {
      animation-delay: -1.1s;
    }

    .circuit-nodes circle:nth-child(3n) {
      animation-delay: -2.2s;
    }

    .circuit-arrows path {
      stroke-dasharray: 9 7;
      animation: circuit-crawl 2.8s ease-out 1 both;
    }

    @keyframes circuit-crawl {
      from { stroke-dashoffset: 150; }
      to { stroke-dashoffset: -150; }
    }

    @keyframes circuit-energy-fade {
      to { opacity: 0; }
    }

    @keyframes circuit-node-pulse {
      0% { opacity: .25; transform: scale(.72); }
      48% { opacity: 1; transform: scale(1.55); }
      100% { opacity: .82; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .circuit-traces path,
      .circuit-energy,
      .circuit-energy path,
      .circuit-nodes circle,
      .circuit-arrows path {
        animation: none;
      }
    }
  </style>
